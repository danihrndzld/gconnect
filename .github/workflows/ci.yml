name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.24.x", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "These files need gofmt:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 -json -cover -coverpkg=./... -coverprofile=cover.out ./... > test.json || { grep -h '"Action":"fail"' test.json | head -20; exit 1; }
      - name: JUnit and coverage summary
        if: always()
        run: |
          python3 -I scripts/report/go_to_report_inputs.py junit test.json junit.xml
          python3 -I scripts/report/go_to_report_inputs.py cober cover.out coverage.json github.com/danihrndzld/gconnect/
      - name: coverage gate (95% of statements)
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "statement coverage: $total%"
          awk -v t="$total" 'BEGIN { exit (t < 95) }'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.go }}
          path: |
            junit.xml
            coverage.json
            test.json
